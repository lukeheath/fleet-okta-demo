name: Validate
on:
  pull_request:
jobs:
  flopacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validator unit tests
        run: python -m unittest discover -s tools/tests -v
      - name: Validate flopacks
        run: |
          shopt -s nullglob
          files=(okta/workflows/*/*.flopack)
          if [ ${#files[@]} -eq 0 ]; then echo "No flopacks yet"; exit 0; fi
          tools/validate-flopack "${files[@]}"
  fleet-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g fleetctl@4.93.0
      - name: fleetctl gitops --dry-run
        env:
          FLEET_URL: ${{ secrets.FLEET_URL }}
          FLEET_API_TOKEN: ${{ secrets.FLEET_API_TOKEN }}
          OKTA_WEBHOOK_URL: ${{ secrets.OKTA_WEBHOOK_URL }}
          FLEET_GLOBAL_ENROLL_SECRET: ${{ secrets.FLEET_GLOBAL_ENROLL_SECRET }}
          FLEET_WORKSTATIONS_ENROLL_SECRET: ${{ secrets.FLEET_WORKSTATIONS_ENROLL_SECRET }}
        run: |
          fleetctl config set --address "$FLEET_URL" --token "$FLEET_API_TOKEN"
          fleetctl gitops -f fleet/default.yml -f fleet/fleets/workstations.yml --delete-other-fleets --dry-run
