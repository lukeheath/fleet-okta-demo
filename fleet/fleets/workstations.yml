name: Workstations
settings:
  webhook_settings:
    failing_policies_webhook:
      enable_failing_policies_webhook: true
      destination_url: $OKTA_WEBHOOK_URL
      host_batch_size: 0
agent_options:
  config:
    options:
      distributed_interval: 10
      distributed_plugin: tls
      distributed_tls_max_attempts: 3
      logger_tls_endpoint: /api/osquery/log
      logger_tls_period: 10
      pack_delimiter: /
controls:
  scripts:
    - path: ../lib/macos/scripts/deploy-claude-settings.sh
policies:
  # Policies with webhooks_and_tickets_enabled: true gate Okta sign-in. Fleet sends failing
  # hosts to the Okta Fail flow, and the Restore flow's gating_policies list must name the
  # same policies (tools/validate-flopack checks this).
  - name: Gatekeeper enabled
    description: Gatekeeper only allows apps from the App Store and identified developers.
    resolution: Turn Gatekeeper back on in System Settings > Privacy & Security.
    platform: darwin
    query: SELECT 1 FROM gatekeeper WHERE assessments_enabled = 1;
    webhooks_and_tickets_enabled: true
  - name: Claude Code configured to org standard
    description: >-
      Claude Code's managed settings file (/Library/Application Support/ClaudeCode/managed-settings.json)
      contains every org-standard setting. Sign-in is forced to Claude.ai, bypass permissions mode is
      disabled, and Claude Code is denied reading .env files, .env.* files, and the secrets folder.
    resolution: >-
      IT reruns the deploy-claude-settings.sh script on this Mac from Fleet. It rewrites
      /Library/Application Support/ClaudeCode/managed-settings.json with the org standard.
      Don't edit or delete that file by hand.
    platform: darwin
    query: >-
      SELECT 1 WHERE (
        SELECT COUNT(DISTINCT value) FROM parse_json
        WHERE path = '/Library/Application Support/ClaudeCode/managed-settings.json'
        AND (
          (fullkey = 'forceLoginMethod' AND value = 'claudeai')
          OR (fullkey = 'permissions/disableBypassPermissionsMode' AND value = 'disable')
          OR (fullkey LIKE 'permissions/deny/%' AND value = 'Read(./.env)')
          OR (fullkey LIKE 'permissions/deny/%' AND value = 'Read(./.env.*)')
          OR (fullkey LIKE 'permissions/deny/%' AND value = 'Read(./secrets/**)')
        )
      ) = 5;
    webhooks_and_tickets_enabled: true
software:
reports:
